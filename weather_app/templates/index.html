<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Forecast</h1>
            <p>Get real-time weather information for any city</p>
        </header>

        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..." 
                value="London"
            >
            <button onclick="searchWeather()">Search</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div id="weatherContainer" class="weather-container" style="display: none;">
            <div class="weather-header">
                <h2 id="cityName"></h2>
                <p id="lastUpdated"></p>
            </div>

            <div class="weather-main">
                <div class="temperature-section">
                    <div class="temperature" id="temperature"></div>
                    <div class="weather-description" id="weatherDesc"></div>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail-card">
                    <div class="detail-icon">💧</div>
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">💨</div>
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>

                <div class="detail-card">
                    <div class="detail-icon">🔽</div>
                    <div class="detail-label">Pressure</div>
                    <div class="detail-value" id="pressure"></div>
                </div>
            </div>
        </div>

        <div id="defaultMessage" class="default-message">
            <p>🔍 Search for a city to see its weather information</p>
        </div>
    </div>

    <script>
        // Search on Enter key
        document.getElementById('cityInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchWeather();
            }
        });

        // Load weather for default city on page load
        window.addEventListener('load', function() {
            searchWeather();
        });

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            
            if (!city) {
                showError('Please enter a city name');
                return;
            }

            showLoading(true);
            hideError();
            document.getElementById('weatherContainer').style.display = 'none';
            document.getElementById('defaultMessage').style.display = 'none';

            try {
                const response = await fetch('/api/weather', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ city: city })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Failed to fetch weather data');
                    showLoading(false);
                    return;
                }

                displayWeather(data);
                showLoading(false);
            } catch (error) {
                showError('Network error. Please try again.');
                showLoading(false);
            }
        }

        function displayWeather(data) {
            const temperature = Math.round(data.temperature);
            const humidity = data.humidity;
            const windSpeed = data.wind_speed;
            const pressure = data.pressure;
            const description = data.weather_description;
            const cityName = `${data.city}, ${data.country}`;
            
            const time = new Date(data.time);
            const formattedTime = time.toLocaleString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            document.getElementById('cityName').textContent = cityName;
            document.getElementById('lastUpdated').textContent = `Last updated: ${formattedTime}`;
            document.getElementById('temperature').textContent = `${temperature}°C`;
            document.getElementById('weatherDesc').textContent = description;
            document.getElementById('humidity').textContent = `${humidity}%`;
            document.getElementById('windSpeed').textContent = `${windSpeed.toFixed(1)} km/h`;
            document.getElementById('pressure').textContent = `${pressure} hPa`;

            document.getElementById('weatherContainer').style.display = 'block';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('defaultMessage').style.display = 'none';
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }
    </script>
</body>
</html>
